services:
  - type: web
    name: lost-found-backend
    runtime: java
    rootDir: backend
    buildCommand: mvn clean package -DskipTests
    startCommand: java -jar target/lost-found-backend-1.0.0.jar
    envVars:
      - key: PORT
        value: 10000
      - key: SERVER_ADDRESS
        value: 0.0.0.0
      - key: CORS_ALLOWED_ORIGINS
        value: https://veeradurgasai.github.io,http://localhost:5173
