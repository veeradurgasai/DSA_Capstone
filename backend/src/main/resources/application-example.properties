# ============================================================
# Application Properties Template (Production Example)
# Copy to application-prod.properties or set via Environment Variables
# ============================================================

server.port=8080

# Production MySQL Database
DB_URL=jdbc:mysql://localhost:3306/lost_found_db?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
DB_USERNAME=root
DB_PASSWORD=your_secure_password
DB_DRIVER=com.mysql.cj.jdbc.Driver
JPA_DIALECT=org.hibernate.dialect.MySQLDialect

# JWT Secret (minimum 256-bit base64 encoded)
JWT_SECRET=your_base64_encoded_256_bit_secret_key_here_lost_found_system_key

# Allowed Frontend URLs (e.g. GitHub Pages)
CORS_ALLOWED_ORIGINS=https://username.github.io,http://localhost:5173
