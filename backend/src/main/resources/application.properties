# ============================================================
# Lost & Found Intelligence System - Application Properties
# ============================================================

spring.application.name=lost-found-backend
server.port=${PORT:8080}

# ------------------------------------------------------------
# Database Configuration
# Default: Embedded H2 in MySQL Compatibility Mode
# Can be switched using environment variables
# ------------------------------------------------------------
spring.datasource.url=${DB_URL:jdbc:h2:file:./data/lostfounddb;MODE=MySQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1;AUTO_SERVER=TRUE}
spring.datasource.username=${DB_USERNAME:sa}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=${DB_DRIVER:org.h2.Driver}

# ------------------------------------------------------------
# JPA & Hibernate Settings
# ------------------------------------------------------------
spring.jpa.database-platform=${JPA_DIALECT:org.hibernate.dialect.H2Dialect}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false

# ------------------------------------------------------------
# H2 Console
# ------------------------------------------------------------
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
spring.h2.console.settings.web-allow-others=false

# ------------------------------------------------------------
# Security & JWT Configuration
# ------------------------------------------------------------
app.jwt.secret=${JWT_SECRET:404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970}
app.jwt.expiration-ms=86400000

# ------------------------------------------------------------
# CORS Configuration
# ------------------------------------------------------------
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:3000,http://127.0.0.1:5173}

# ------------------------------------------------------------
# File Storage
# ------------------------------------------------------------
app.upload.dir=./uploads

# ------------------------------------------------------------
# Admin Registration Code & OTP
# ------------------------------------------------------------
app.admin.registration-code=${ADMIN_REGISTRATION_CODE:Amma52}

# Development fallback OTP
# This should NOT be used when real OTP verification is enabled.
app.admin.registration-otp=${ADMIN_REGISTRATION_OTP:123456}

# ------------------------------------------------------------
# MessageCentral VerifyNow SMS OTP Configuration
# ------------------------------------------------------------

# Unified environment variable mappings:
# MESSAGE_CENTRAL_CUSTOMER_ID, MESSAGE_CENTRAL_EMAIL, MESSAGE_CENTRAL_KEY
messagecentral.customer-id=${MESSAGE_CENTRAL_CUSTOMER_ID:C-C0D85763CDFC41C}
messagecentral.email=${MESSAGE_CENTRAL_EMAIL:}
messagecentral.key=${MESSAGE_CENTRAL_KEY:}
messagecentral.base-url=${MESSAGE_CENTRAL_BASE_URL:https://cpaas.messagecentral.com}

# Automatically import local secrets configuration if present (ignored by Git)
spring.config.import=optional:file:application-local.properties,optional:file:./application-local.properties,optional:file:../application-local.properties,optional:file:.env[.properties],optional:file:../.env[.properties],optional:classpath:application-local.properties

# ------------------------------------------------------------
# Logging
# ------------------------------------------------------------
logging.level.com.lostfound=INFO
logging.level.org.springframework.web=INFO
logging.level.org.hibernate=ERROR